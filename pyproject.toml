[project]
name = "rink"
version = "0.1.2"
description = "Upload files/folders to Cloudflare R2 and get a shareable link"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rc", email = "crretsim@gmail.com" }]
keywords = ["cloudflare", "r2", "s3", "upload", "cli", "presigned-url"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = [
    "boto3>=1.34",
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
rink = "rink.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rink"]

[tool.hatch.build.targets.sdist]
include = ["rink", "README.md", "LICENSE", "pyproject.toml"]
